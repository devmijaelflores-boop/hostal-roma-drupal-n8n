roma_shop.catalog:
  path: '/tienda'
  defaults:
    _controller: '\Drupal\roma_shop\Controller\ShopController::catalog'
    _title: 'Tienda de estadías de demostración'
  requirements:
    _permission: 'view roma availability'
  options:
    no_cache: true
roma_shop.add:
  path: '/tienda/agregar'
  defaults:
    _form: '\Drupal\roma_shop\Form\AddStayForm'
    _title: 'Agregar una estadía al carrito'
  requirements:
    _permission: 'request roma reservations'
  options:
    no_cache: true
roma_shop.cart:
  path: '/carrito'
  defaults:
    _form: '\Drupal\roma_shop\Form\CartForm'
    _title: 'Tu carrito de demostración'
  requirements:
    _permission: 'request roma reservations'
  options:
    no_cache: true
roma_shop.orders:
  path: '/admin/roma/pedidos'
  defaults:
    _controller: '\Drupal\roma_shop\Controller\ShopController::orders'
    _title: 'Pedidos de la tienda académica'
  requirements:
    _permission: 'administer commerce_order'
  options:
    _admin_route: true
    no_cache: true

